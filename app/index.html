<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroPolish</title>
<meta name="description" content="Astrofoto-editor in Photoshop-stijl voor de Dwarf 3 en andere smart-telescopen. Werkt volledig lokaal.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="menubar" class="menubar"></header>
  <div id="optionsbar" class="optionsbar"></div>
  <div class="workspace">
    <nav id="toolbar" class="toolbar"></nav>
    <section class="docarea">
      <div id="doctabs" class="doctabs"></div>
      <div id="stage" class="stage">
        <canvas id="view"></canvas>
        <div id="startscreen" class="startscreen"></div>
        <div id="busy" class="busy hidden"><span class="spinner"></span><span id="busyText"></span></div>
      </div>
      <footer id="statusbar" class="statusbar"></footer>
    </section>
    <aside id="dock" class="dock"></aside>
  </div>
</div>
<div id="menuLayer"></div>
<dialog id="dlg" class="dlg"><div id="dlgBody"></div></dialog>
<input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.webp,.tif,.tiff,.fit,.fits,.fts,image/*" hidden>
<input type="file" id="jsonInput" accept=".json,application/json" hidden>
<div class="overlay hidden" id="overlay"><div class="overlay-box"><span class="spinner big"></span><p id="overlayText"></p></div></div>
<div class="toast" id="toast"></div>

<script src="js/engine.js"></script>
<script src="js/ops.js"></script>
<script src="js/formats.js"></script>
<script src="js/stack.js"></script>
<script src="js/core.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
