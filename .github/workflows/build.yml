name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Lint (syntax + project rules)
        run: node test/lint.js
      - name: File formats (FITS/TIFF fixtures)
        run: node test/formats-test.js
      - name: Algorithms (numerical properties)
        run: node test/algorithms-test.js
      - name: Projects and validation
        run: node test/project-test.js
      - name: Electron security settings
        run: node test/electron-security-test.js
      - name: Layer engine (all operations, masks, blend modes)
        run: node test/ops-test.js
      - name: Stacking
        run: node test/stack-test.js
      - name: Legacy engine presets
        run: node test/engine-test.js /tmp/astropolish-test
        env:
          W: '960'
          H: '540'

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright (uses the runner's Google Chrome)
        run: pip install playwright==1.63.0
      - name: Interface test (full workflow in Chrome)
        run: |
          cd app && python -m http.server 8765 &
          sleep 2
          python test/ui-test.py
        env:
          OUT: /tmp/ui
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/ui/*.png

  windows:
    needs: [test, ui]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Audit dependencies (report only)
        continue-on-error: true
        run: npm audit --omit=optional
      - name: Build .exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AstroPolish-Windows
          path: dist/*.exe

  mac:
    needs: [test, ui]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build .dmg and .zip (universal for Apple Silicon and Intel, ad-hoc signed)
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify signature and architectures (arm64 + x86_64)
        run: |
          APP=$(find dist -maxdepth 3 -name "AstroPolish.app" | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/AstroPolish"
      - name: Smoke test (the app starts and keeps running for 20 seconds)
        run: |
          APP=$(find dist -maxdepth 3 -name "AstroPolish.app" | head -1)
          "$APP/Contents/MacOS/AstroPolish" > /tmp/astropolish.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID; then echo "AstroPolish is running"; kill $PID; else echo "AstroPolish exited early"; cat /tmp/astropolish.log; exit 1; fi
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AstroPolish-macOS
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    needs: [windows, mac]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # A release is only created for a NEW version number. Pushing other changes to main never
      # replaces the files of an existing release (so a version always means the same build).
      - name: Check whether this version was already released
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"; echo "Release v${{ steps.v.outputs.version }} already exists: not publishing."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        if: steps.exists.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AstroPolish ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          body: |
            **Download voor Windows**
            - `AstroPolish-${{ steps.v.outputs.version }}-portable.exe`: direct starten, niets installeren
            - `AstroPolish-${{ steps.v.outputs.version }}-setup.exe`: installeren met snelkoppeling op het bureaublad

            **Download voor macOS** (Apple Silicon en Intel, macOS 12 of nieuwer)
            - `AstroPolish-${{ steps.v.outputs.version }}-mac.dmg`: openen en AstroPolish naar Programma's slepen

            De app is niet digitaal ondertekend. Windows SmartScreen: kies *Meer informatie* → *Toch uitvoeren*. macOS: open de app één keer, ga naar *Systeeminstellingen → Privacy en beveiliging* en kies *Open toch*.
