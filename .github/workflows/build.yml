name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Engine test
        run: node test/engine-test.js /tmp/astropolish-test
        env:
          W: '960'
          H: '540'

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build .exe
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AstroPolish-Windows
          path: dist/*.exe
      - name: Read version
        id: v
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AstroPolish ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.exe
          overwrite_files: true
          body: |
            **Download voor Windows**
            - `AstroPolish-${{ steps.v.outputs.version }}-portable.exe`: direct starten, niets installeren
            - `AstroPolish-${{ steps.v.outputs.version }}-setup.exe`: installeren met snelkoppeling op het bureaublad

            Windows SmartScreen kan waarschuwen omdat de app niet digitaal ondertekend is: kies *Meer informatie* → *Toch uitvoeren*.
